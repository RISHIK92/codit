// /shared/proto/ai.proto

syntax = "proto3";

package ai;

option go_package = "gateway/pkg/pb";

// ── Service ───────────────────────────────────────────────────────────────────

service AiService {
  // Send one assistant message; the service assembles context itself
  // (user profile via UserService, active file content via FileService)
  // rather than trusting whatever the client happens to have in memory.
  // Server-streaming: each ChatResponse carries one text delta, not the
  // full reply — the stream ending signals completion.
  rpc Chat (ChatRequest) returns (stream ChatResponse);

  // Grades a free-text knowledge-check answer (code_completion/debug types)
  // by judging whether it captures the correct fix/concept — not an exact
  // string match, so equivalent-but-differently-phrased answers (different
  // variable names, or an answer that states only the crucial change rather
  // than the whole surrounding snippet) are graded correct.
  rpc GradeAnswer (GradeAnswerRequest) returns (GradeAnswerResponse);

  // Grades a phase submission one criterion at a time, each verdict carrying
  // the evidence for it.
  //
  // Deliberately not a chat call. Asking a model "does this submission meet the
  // goal?" produces a holistic opinion, and holistic opinions drift generous —
  // which is the failure that matters, because a false pass silently turns a
  // learning gate into a rubber stamp. Judging one narrow criterion at a time
  // and demanding a file, a line range, and a quote for every pass converts the
  // question from "is this good" into "point at where this is true", which a
  // model cannot answer by being agreeable.
  //
  // The caller decides the phase verdict by conjunction over these results;
  // this RPC never says whether the phase passed.
  rpc GradeCriteria (GradeCriteriaRequest) returns (GradeCriteriaResponse);
}

// ── GradeCriteria ────────────────────────────────────────────────────────────

message CriterionToGrade {
  string id   = 1;
  string text = 2;
  string kind = 3;  // "behavioral" | "structural" | "conceptual"
}

message GradeCriteriaRequest {
  string user_email  = 1;
  string project_id  = 2;
  string phase_title = 3;
  // Context only — criteria are what gets graded. Included so the model can
  // tell which phase it's in and stay out of later phases' concerns.
  string phase_goal  = 4;
  repeated CriterionToGrade criteria = 5;
}

message CriterionVerdict {
  string criterion_id   = 1;
  bool   passed         = 2;
  // Required when passed. A pass with no citable evidence is downgraded to a
  // failure by the caller — an unevidenced claim is exactly what this design
  // exists to reject.
  string evidence_path  = 3;
  string evidence_lines = 4;
  string evidence_quote = 5;
  // One sentence. Shown to the user when the criterion failed.
  string reasoning      = 6;
  // True when this criterion could not be graded at all (model error, malformed
  // response). Not the same as failing: the user's work wasn't judged.
  bool   ungraded       = 7;
}

message GradeCriteriaResponse {
  repeated CriterionVerdict verdicts = 1;
  // Model that produced these, recorded so a bad batch can be traced.
  string model = 2;
}

// ── Chat ──────────────────────────────────────────────────────────────────────

message ChatMessage {
  string role    = 1; // "user" | "assistant"
  string content = 2;
}

message ChatRequest {
  string user_email        = 1;
  string project_id        = 2;
  string phase_id          = 3;
  string active_file_path  = 4; // empty if no file is open
  string message           = 5; // latest user message
  repeated ChatMessage history = 6; // prior turns, oldest first
  // "" or "chat" = full agentic assistant (tool-calling, multi-file context).
  // "explain" = direct single-shot call, no tools, no file-fetching loop —
  // used for the cheap Option+Click "explain this" flow.
  // "review" = grades a phase submission. Inspects the user's actual project
  // files via tool calls and ends its reply with a line reading exactly
  // "VERDICT: MET" or "VERDICT: NOT MET".
  //
  // That verdict line is a machine-read contract, not prose: UserProjectService
  // .SubmitPhaseReview parses it server-side to decide whether to advance the
  // phase. Never call this mode directly from an end-user client and act on the
  // result — a caller that grades itself is not a gate. Route reviews through
  // SubmitPhaseReview, which is the only component that should interpret this.
  string mode               = 7;
  // Client-supplied summary of the user's current project and task, e.g.
  // "Project: Recipe Tracker (React, Node) — Phase 2: State Management".
  // The client already holds this in memory (active project/phase
  // selection); pushing it here is cheaper than the service re-deriving it
  // via extra user-service calls.
  string current_task       = 8;
  // 0 = normal, operate on the live editable project. > 0 = the user is
  // viewing a past phase's frozen snapshot (read-only) — list_files/
  // read_file and the active-file context should read from that phase's
  // PhaseSnapshotFile tree instead of the live ProjectFile tree.
  int32  snapshot_phase_number = 9;
}

message ChatResponse {
  // One text delta of the reply. Concatenate all deltas received on the
  // stream, in order, to reconstruct the full message.
  string reply = 1;
}

// ── GradeAnswer ─────────────────────────────────────────────────────────────

message GradeAnswerRequest {
  string question       = 1;
  string correct_answer = 2;
  string explanation    = 3;
  string question_type  = 4; // "code_completion" | "debug"
  string user_answer    = 5;
}

message GradeAnswerResponse {
  bool is_correct = 1;
}
