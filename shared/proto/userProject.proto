// /shared/proto/userProject.proto

syntax = "proto3";

package userProject;

option go_package = "gateway/pkg/pb";

service UserProjectService {
  rpc CreateProject (CreateUserProjectRequest) returns (CreateUserProjectResponse);
  rpc GetUserProjectById (GetUserProjectByIdRequest) returns (GetUserProjectByIdResponse);
  rpc GetAllUserProjects (GetAllUserProjectsRequest) returns (GetAllUserProjectsResponse);
  rpc GetUserProjectsByStatus (GetUserProjectsByStatusRequest) returns (GetUserProjectsByStatusResponse);
  // Archives (or un-archives / "resumes") a user's project. A user may have
  // at most 1 live project (archived = false, status = in_progress) and at
  // most 1 archived project at a time — archiving the live project frees the
  // live slot to start a different one; resuming an archived project
  // requires the live slot to be free first.
  rpc SetUserProjectArchived (SetUserProjectArchivedRequest) returns (SetUserProjectArchivedResponse);
  // Submits the user's current phase for grading, and advances it if the
  // grader judges the goal met.
  //
  // This is deliberately the ONLY path that can advance a phase. There is no
  // separate "advance" RPC: an endpoint that advances on request is an
  // endpoint any authenticated user can call to skip the work, which makes
  // every guarantee about demonstrated understanding worthless. Grading,
  // the verdict, and the advance all happen server-side inside this one call.
  //
  // The request carries only the project — the phase under review, its goal,
  // and its knowledge-check status are all derived server-side from the
  // caller's own enrollment, so none of them can be spoofed by the client.
  rpc SubmitPhaseReview (SubmitPhaseReviewRequest) returns (SubmitPhaseReviewResponse);

  // The growth record: four stats, current era, and what the next one needs.
  //
  // Everything returned is derived from rows the user's own actions created —
  // nothing is a stored score. The four stats are deliberately returned
  // separately and never summed: a single number would let output stand in for
  // comprehension, which is the substitution this product exists to prevent.
  rpc GetGrowth (GetGrowthRequest) returns (GetGrowthResponse);

  // Begins an explain-it-back checkpoint on a phase the user has completed,
  // returning a question grounded in the code they actually wrote.
  rpc StartCheckpoint (StartCheckpointRequest) returns (StartCheckpointResponse);

  // Grades a checkpoint explanation. Passing is the only thing that clears fog.
  rpc SubmitCheckpoint (SubmitCheckpointRequest) returns (SubmitCheckpointResponse);
}

// ── Growth ───────────────────────────────────────────────────────────────────

message GetGrowthRequest {
  string email = 1;
}

message EraRequirementProto {
  string label = 1;   // phrased for a human; shown verbatim
  bool   met   = 2;
  int32  have  = 3;
  int32  need  = 4;
}

message UnexplainedPhaseProto {
  string project_id   = 1;
  string project_name = 2;
  int32  phase_number = 3;
}

message GetGrowthResponse {
  // Never blended. Four numbers, always four.
  int32  build      = 1;
  int32  understand = 2;
  int32  explore    = 3;
  int32  show       = 4;

  string era_name  = 5;
  string era_blurb = 6;
  int32  era_index = 7;
  string next_era_name = 8;
  repeated EraRequirementProto next_requirements = 9;

  // Fog: work shipped but never explained back. A property of the record, not
  // a judgement about the person.
  int32  fog_count = 10;
  repeated UnexplainedPhaseProto unexplained = 11;
}

message StartCheckpointRequest {
  string email        = 1;
  string project_id   = 2;
  int32  phase_number = 3;
}

message StartCheckpointResponse {
  string checkpoint_id = 1;
  string question      = 2;
}

message SubmitCheckpointRequest {
  string email         = 1;
  string checkpoint_id = 2;
  string answer        = 3;
}

message SubmitCheckpointResponse {
  bool   passed   = 1;
  string feedback = 2;
  repeated string missing_concepts = 3;
}

message CreateUserProjectRequest {
  string project_id = 1;
  string email = 2;
  string status = 3;
  int32 current_phase = 4;
}

message CreateUserProjectResponse {
  bool success = 1;
}

message GetUserProjectByIdRequest {
  string project_id = 1;
}

message GetUserProjectByIdResponse {
  UserProject user_project = 1;
}

message GetAllUserProjectsRequest {
  string email = 1;
}

message GetAllUserProjectsResponse {
  repeated UserProject user_projects = 1;
}

message UserProject {
  string project_id = 1;
  string email = 2;
  string status = 3;
  int32 current_phase = 4;
  bool archived = 5;
}

message GetUserProjectsByStatusRequest {
  string email = 1;
  string status = 2;
}

message GetUserProjectsByStatusResponse {
  repeated UserProject user_projects = 1;
}

message SetUserProjectArchivedRequest {
  string project_id = 1;
  string email = 2;
  bool archived = 3;
}

message SetUserProjectArchivedResponse {
  UserProject user_project = 1;
}

message SubmitPhaseReviewRequest {
  string project_id = 1;
  string email = 2;
  // Optional: the file the user has open, passed through to the grader as
  // context. Never used to decide anything — purely a hint about where the
  // user is working.
  string active_file_path = 3;
}

// How one criterion was judged, sent back so the user sees a checklist rather
// than a paragraph. Being told "3 of 5 checks passed, here's which two didn't
// and where" is actionable; a prose verdict is something to argue with.
message CriterionResultProto {
  string criterion_id   = 1;
  string text           = 2;
  string kind           = 3;
  bool   passed         = 4;
  // Why it failed, or where it was found when it passed.
  string reasoning      = 5;
  // Populated on a pass — lets the user see what the grader actually looked at,
  // which is also what makes a wrong verdict arguable rather than mysterious.
  string evidence_path  = 6;
  string evidence_lines = 7;
  // Shown only on failure. Names the concept, never the code.
  string hint           = 8;
  // True when grading failed rather than the work — the user should retry, not
  // go looking for a mistake they didn't make.
  bool   ungraded       = 9;
}

message SubmitPhaseReviewResponse {
  // "met"     — goal judged met; the phase was advanced.
  // "not_met" — goal judged not met; see feedback.
  // "blocked" — never reached the grader: the phase's knowledge checks
  //             aren't all answered correctly yet.
  string verdict = 1;
  // True only when the phase actually advanced. Clients must use this rather
  // than inferring advancement from the feedback text.
  bool   advanced = 2;
  // The grader's prose explanation, or the reason the submission was blocked.
  string feedback = 3;
  // Authoritative post-review phase number — clients should adopt this rather
  // than incrementing their own local counter.
  int32  current_phase = 4;
  // Populated when verdict = "blocked", so the UI can say "3 of 5 correct".
  int32  checks_total = 5;
  int32  checks_correct = 6;
  // Per-criterion outcomes, in rubric order. Empty when blocked (nothing was
  // graded) or for phases with no rubric authored.
  repeated CriterionResultProto results = 7;
  int32  criteria_total  = 8;
  int32  criteria_passed = 9;
}